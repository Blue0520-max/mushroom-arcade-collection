<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a231e">
  <meta name="description" content="《超级玛丽 · 蘑菇王国大冒险》四版合辑。V1 至 V4 均可在线试玩。V4 洞穴龙拓展篇加入骑龙吞敌、炸弹龟与鬼火。">
  <title>蘑菇王国大冒险 · 四版合辑</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">超级玛丽 · 四版合辑</p>
      <h1>蘑菇王国<span>大冒险</span></h1>
      <p class="intro">从草甸一路跳到熔岩王座。选择一个版本，用键盘或触屏开始冒险。</p>
      <a class="start" href="./v4/index.html">试玩 V4 <span aria-hidden="true">→</span></a>
    </header>
    <section aria-labelledby="versions">
      <h2 id="versions">选择版本</h2>
      <div class="grid">
        <a class="card" href="./v1/index.html">
          <img src="./v1/assets/art/meadow.webp" alt="" width="960" height="540">
          <div class="card-copy">
            <span class="version">V1</span>
            <h3>初代冒险</h3>
            <p>踩弹簧、踢龟壳，找齐每关三枚星币，踏上四个世界的旅程。</p>
            <span class="action">打开第一版 <span aria-hidden="true">→</span></span>
          </div>
        </a>
        <a class="card" href="./v2/index.html">
          <img src="./v2/assets/art/cavern.webp" alt="" width="960" height="540">
          <div class="card-copy">
            <span class="version">V2</span>
            <h3>密室与火球</h3>
            <p>钻管探秘、蹲行攀藤，吃下火焰花用火球打出高分。</p>
            <span class="action">打开第二版 <span aria-hidden="true">→</span></span>
          </div>
        </a>
        <a class="card" href="./v3-original/index.html">
          <img src="./v3-original/assets/art/sky.webp" alt="" width="960" height="540">
          <div class="card-copy">
            <span class="version">V3</span>
            <h3>渡船、炮舰与王座</h3>
            <p>换乘晶湖渡船、开闸穿过倒悬矿井，借风登上炮舰。</p>
            <span class="action">打开第三版原版 <span aria-hidden="true">→</span></span>
          </div>
        </a>
        <a class="card" href="./v4/index.html">
          <img src="./v4/assets/art/castle.webp" alt="" width="960" height="540">
          <div class="card-copy">
            <span class="version">V4</span>
            <h3>洞穴龙拓展篇</h3>
            <p>骑上洞穴龙吞敌，避开引信已点燃的炸弹龟和跃出熔岩的鬼火。</p>
            <span class="action">打开第四版 <span aria-hidden="true">→</span></span>
          </div>
        </a>
      </div>
    </section>
    <footer>各版均可直接选关，并提供休闲、经典和专家难度。</footer>
  </main>
</body>
</html>
